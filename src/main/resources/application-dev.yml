server:
  servlet:
    session:
      cookie:
        # Dev serves plain HTTP on *.localhost; a Secure cookie would never come back.
        secure: false

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/caderly
    username: ${DB_USER:caderly}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # Local catch-all SMTP inbox. Start one with:
  #   docker run -d -p 1025:1025 -p 8025:8025 axllent/mailpit
  # then read the mail at http://localhost:8025. (Mailpit is the maintained successor to
  # MailHog, which the PRD names; same SMTP-sink-plus-web-UI role.)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

caderly:
  email:
    from: ${CADERLY_EMAIL_FROM:no-reply@caderly.local}
  people:
    # Dev-only fixed key, never used in prod (see application.yml's no-default line).
    encryption-key: ${CADERLY_EMPLOYEE_ENCRYPTION_KEY:nD7WkJr9yrrNuO/Imc6JN/N8SKo+PsNZi1DAcSFpih4=}
