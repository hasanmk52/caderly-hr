<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{nav.for-action}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">
    <h1 class="mb-4" th:text="#{nav.for-action}">For Action</h1>

    <!--/* UI Guidelines §8.6: "Tasks · Time off requests" pills — Tasks doesn't exist yet
           (Phase 2), so this page is Time off requests only for now. */-->
    <ul class="nav nav-pills mb-3">
      <li class="nav-item"><span class="nav-link active" th:text="#{for-action.time-off-requests-pill}">Time off requests</span></li>
    </ul>

    <ul class="nav nav-tabs mb-3" id="forActionTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending-pane"
                type="button" role="tab" aria-controls="pending-pane" aria-selected="true">
          <span th:text="#{for-action.pending-tab}">Pending</span> <span id="pendingCount" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(pending)}">0</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="completed-tab" data-bs-toggle="tab" data-bs-target="#completed-pane"
                type="button" role="tab" aria-controls="completed-pane" aria-selected="false">
          <span th:text="#{for-action.completed-tab}">Completed</span> <span id="completedCount" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(completed)}">0</span>
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="pending-pane" role="tabpanel" aria-labelledby="pending-tab">
        <div id="pendingList" th:replace="~{leave/for-action :: pendingList}"></div>
      </div>

      <div class="tab-pane fade" id="completed-pane" role="tabpanel" aria-labelledby="completed-tab">
        <div id="completedList" th:replace="~{leave/for-action :: completedList}"></div>
      </div>
    </div>

    <!--/* Reject modal (UI Guidelines §6/§8.6): page-local shell — unlike the Book Time Off
           modal, this only exists here. Starts empty and is lazily filled via htmx on click,
           same convention as layout.html's #bookLeaveModalBody; the fragment itself lives in
           leave/for-action.html so it's never also rendered as literal body content when this
           page is requested as a full view (see that file's header comment). */-->
    <div class="modal fade" id="rejectLeaveModal" tabindex="-1" aria-hidden="true" aria-labelledby="rejectLeaveModalLabel">
      <div class="modal-dialog">
        <div class="modal-content" id="rejectLeaveModalBody"></div>
      </div>
    </div>
  </div>
</th:block>

</body>
</html>
