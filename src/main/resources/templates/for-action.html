<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{layout :: layout(#{nav.for-action}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">
    <h1 class="mb-4" th:text="#{nav.for-action}">For Action</h1>

    <!--/* UI Guidelines §8.6: "Tasks · Time off requests" pills. Tasks is open to every signed-in
           user (PRD FR-8.4); Time off requests stays Manager/Admin only (FR-8.2/FR-8.3) —
           sub-phase 1.9 / ADR 0015. Time off requests is the default-active pane for an approver
           (that's what they came here to do); Tasks is the default only for a plain Employee, who
           has no approvals pane at all. Bootstrap tabs, same convention as the Pending/Completed
           tabs below. */-->
    <ul class="nav nav-pills mb-3" id="forActionPills" role="tablist">
      <li class="nav-item" role="presentation" sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <button class="nav-link active" id="time-off-pill" data-bs-toggle="tab" data-bs-target="#time-off-pane"
                type="button" role="tab" aria-controls="time-off-pane" aria-selected="true"
                th:text="#{for-action.time-off-requests-pill}">Time off requests</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" th:classappend="${!isApprover} ? 'active'" id="tasks-pill" data-bs-toggle="tab"
                data-bs-target="#tasks-pane" type="button" role="tab" aria-controls="tasks-pane"
                th:aria-selected="${!isApprover}" th:text="#{for-action.tasks-pill}">Tasks</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade" th:classappend="${!isApprover} ? 'show active'" id="tasks-pane" role="tabpanel" aria-labelledby="tasks-pill">
        <div th:if="${profileTask == null}" class="text-center text-muted py-5">
          <i class="bi bi-check2-circle fs-1 d-block mb-2" aria-hidden="true"></i>
          <p class="mb-0" th:text="#{for-action.tasks.empty}">You're all caught up.</p>
        </div>
        <ul th:if="${profileTask != null}" class="list-group">
          <li class="list-group-item d-flex justify-content-between align-items-start gap-3">
            <div>
              <div class="fw-semibold" th:text="#{for-action.tasks.complete-profile-title}">Complete your profile</div>
              <div class="text-muted small" th:text="#{for-action.tasks.complete-profile-missing(${profileTask.missingFieldsSummary()})}">Missing: phone, city</div>
            </div>
            <a class="btn btn-primary btn-sm flex-shrink-0" th:href="@{/profile/{id}(id=${profileTask.employeeId()})}"
               th:text="#{for-action.tasks.complete-profile-action}">Go to my profile</a>
          </li>
        </ul>
      </div>

      <div class="tab-pane fade" th:classappend="${isApprover} ? 'show active'" id="time-off-pane" role="tabpanel" aria-labelledby="time-off-pill" sec:authorize="hasAnyRole('MANAGER','ADMIN')">
        <ul class="nav nav-tabs mb-3" id="forActionTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="pending-tab" data-bs-toggle="tab" data-bs-target="#pending-pane"
                    type="button" role="tab" aria-controls="pending-pane" aria-selected="true">
              <span th:text="#{for-action.pending-tab}">Pending</span> <span id="pendingCount" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(pending)}">0</span>
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="completed-tab" data-bs-toggle="tab" data-bs-target="#completed-pane"
                    type="button" role="tab" aria-controls="completed-pane" aria-selected="false">
              <span th:text="#{for-action.completed-tab}">Completed</span> <span id="completedCount" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(completed)}">0</span>
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="pending-pane" role="tabpanel" aria-labelledby="pending-tab">
            <div id="pendingList" th:replace="~{leave/for-action :: pendingList}"></div>
          </div>

          <div class="tab-pane fade" id="completed-pane" role="tabpanel" aria-labelledby="completed-tab">
            <div id="completedList" th:replace="~{leave/for-action :: completedList}"></div>
          </div>
        </div>
      </div>
    </div>

    <!--/* Reject modal (UI Guidelines §6/§8.6): page-local shell — unlike the Book Time Off
           modal, this only exists here. Starts empty and is lazily filled via htmx on click,
           same convention as layout.html's #bookLeaveModalBody; the fragment itself lives in
           leave/for-action.html so it's never also rendered as literal body content when this
           page is requested as a full view (see that file's header comment). */-->
    <div class="modal fade" id="rejectLeaveModal" tabindex="-1" aria-hidden="true" aria-labelledby="rejectLeaveModalLabel">
      <div class="modal-dialog">
        <div class="modal-content" id="rejectLeaveModalBody"></div>
      </div>
    </div>
  </div>
</th:block>

</body>
</html>
