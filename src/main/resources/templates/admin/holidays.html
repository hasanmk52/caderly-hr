<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{admin.holidays.title}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-start mb-4">
      <h1 th:text="#{admin.holidays.heading}">Public Holidays</h1>
    </div>

    <!--/* Mirrors admin/organization.html's #organization-content pattern (see
           AdminLeaveController's class Javadoc). */-->
    <div id="holidays-content" hx-swap-oob="true" th:fragment="content">

      <div th:if="${!#lists.isEmpty(uploadErrors)}" class="alert alert-danger mb-3">
        <p class="mb-1 fw-semibold" th:text="#{admin.holidays.upload-rejected}">The upload was rejected — nothing was added:</p>
        <ul class="mb-0">
          <li th:each="error : ${uploadErrors}" th:text="${error}">Line 3: bad date</li>
        </ul>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button type="button" class="btn btn-primary btn-sm"
                th:hx-get="@{/admin/holidays/new-form}"
                hx-target="#holidayOffcanvasBody" hx-swap="innerHTML">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> <span th:text="#{admin.holidays.add}">Add Holiday</span>
        </button>
        <form th:hx-post="@{/admin/holidays/upload}"
              hx-target="#holidays-content" hx-swap="outerHTML" hx-encoding="multipart/form-data"
              class="d-flex align-items-center gap-2">
          <input class="form-control form-control-sm" type="file" name="file" accept=".csv" required
                 th:aria-label="#{admin.holidays.upload-input-aria-label}" />
          <button type="submit" class="btn btn-outline-primary btn-sm text-nowrap">
            <i class="bi bi-upload" aria-hidden="true"></i> <span th:text="#{admin.holidays.upload-csv}">Upload CSV</span>
          </button>
        </form>
      </div>

      <div th:if="${#lists.isEmpty(holidays)}" class="text-center text-muted py-5 mb-5">
        <i class="bi bi-calendar-event fs-1 d-block mb-2" aria-hidden="true"></i>
        <p class="mb-0" th:text="#{admin.holidays.empty}">No holidays yet. Add one or upload a CSV calendar ("date,name" rows).</p>
      </div>

      <div th:unless="${#lists.isEmpty(holidays)}" class="table-responsive mb-5">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th scope="col" th:text="#{common.field.date}">Date</th>
              <th scope="col" th:text="#{common.field.name}">Name</th>
              <th scope="col" class="text-end" th:text="#{common.table.actions}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="holiday : ${holidays}">
              <td th:text="${holiday.date}">2026-01-01</td>
              <td>
                <i class="bi bi-calendar-heart" aria-hidden="true"></i>
                <span th:text="${holiday.name()}">New Year's Day</span>
              </td>
              <td class="text-end">
                <button type="button" class="btn btn-outline-danger btn-sm" th:aria-label="#{admin.holidays.aria.delete}"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#confirmDeleteHoliday-' + ${holiday.id}">
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:each="holiday : ${holidays}" class="modal fade" tabindex="-1" aria-hidden="true"
           th:id="'confirmDeleteHoliday-' + ${holiday.id}">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" th:text="#{admin.holidays.delete-confirm(${holiday.name()})}">Delete this holiday?</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.aria.close}"></button>
            </div>
            <div class="modal-body">
              <p th:text="#{common.action.delete-warning}">This cannot be undone.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" th:text="#{common.action.cancel}">Cancel</button>
              <button type="button" class="btn btn-danger btn-sm" data-bs-dismiss="modal"
                      th:hx-delete="@{/admin/holidays/{id}(id=${holiday.id})}"
                      hx-target="#holidays-content" hx-swap="outerHTML"
                      th:text="#{admin.holidays.delete-submit}">
                Delete holiday
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!--/* Slide-over panel (UI Guidelines §6). Never part of an htmx response — only
           #holidayOffcanvasBody is swapped. */-->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="holidayOffcanvas" style="width: 480px"
         aria-labelledby="holidayOffcanvasLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="holidayOffcanvasLabel" th:text="#{admin.holidays.panel-title}">Holiday</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" th:aria-label="#{common.aria.close}"></button>
      </div>
      <div class="offcanvas-body" id="holidayOffcanvasBody">
        <th:block th:fragment="holidayForm">
  <form th:object="${holidayForm}" th:hx-post="@{/admin/holidays}"
        hx-target="#holidayOffcanvasBody" hx-swap="innerHTML" hx-indicator="#holidayFormSpinner">
    <h6 class="text-muted mb-3" th:text="#{admin.holidays.form-heading}">Add holiday</h6>

    <div class="mb-3">
      <label class="form-label" for="holiday-date">
        <span th:text="#{common.field.date}">Date</span> <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <input class="form-control" type="date" id="holiday-date" th:field="*{date}" required
             th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'" />
      <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Invalid date</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="holiday-name">
        <span th:text="#{common.field.name}">Name</span> <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <input class="form-control" type="text" id="holiday-name" th:field="*{name}" maxlength="200" required
             th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid name</div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="offcanvas" th:text="#{common.action.cancel}">Cancel</button>
      <button class="btn btn-primary btn-sm" type="submit">
        <span id="holidayFormSpinner" class="spinner-border spinner-border-sm htmx-indicator me-1"
              aria-hidden="true"></span>
        <span th:text="#{admin.holidays.save}">Save holiday</span>
      </button>
    </div>
  </form>

  <th:block th:if="${refreshTable}">
    <div th:replace="~{::content}"></div>
  </th:block>
        </th:block>
      </div>
    </div>

  </div>
</th:block>

</body>
</html>
