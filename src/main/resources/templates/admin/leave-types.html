<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{admin.leave-types.title}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-start mb-4">
      <h1 th:text="#{admin.leave-types.title}">Leave Types</h1>
    </div>

    <!--/* Mirrors admin/organization.html's #organization-content pattern (see
           AdminLeaveController's class Javadoc). */-->
    <div id="leave-types-content" hx-swap-oob="true" th:fragment="content">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <button type="button" class="btn btn-primary btn-sm"
                th:hx-get="@{/admin/leave-types/new-form}"
                hx-target="#leaveTypeOffcanvasBody" hx-swap="innerHTML">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> <span th:text="#{admin.leave-types.add}">Add Leave Type</span>
        </button>
      </div>

      <div th:if="${#lists.isEmpty(leaveTypes)}" class="text-center text-muted py-5 mb-5">
        <i class="bi bi-calendar-check fs-1 d-block mb-2" aria-hidden="true"></i>
        <p class="mb-0" th:text="#{admin.leave-types.empty}">No leave types yet. Add one to get started.</p>
      </div>

      <div th:unless="${#lists.isEmpty(leaveTypes)}" class="table-responsive mb-5">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th scope="col" th:text="#{common.field.name}">Name</th>
              <th scope="col" th:text="#{admin.leave-types.table.annual-allowance}">Annual allowance</th>
              <th scope="col" th:text="#{admin.leave-types.paid}">Paid</th>
              <th scope="col" th:text="#{admin.leave-types.table.half-day}">Half-day</th>
              <th scope="col" th:text="#{common.field.status}">Status</th>
              <th scope="col" class="text-end" th:text="#{common.table.actions}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="leaveType : ${leaveTypes}">
              <td>
                <i th:if="${leaveType.icon() != null}" th:class="'bi ' + ${leaveType.icon()}" aria-hidden="true"></i>
                <span th:text="${leaveType.name()}">Annual</span>
              </td>
              <td th:text="${leaveType.defaultAnnualAllowance()}">30</td>
              <td th:text="${leaveType.paid()} ? #{admin.leave-types.paid} : #{admin.leave-types.unpaid}">Paid</td>
              <td th:text="${leaveType.allowsHalfDay()} ? #{admin.leave-types.allowed} : #{admin.leave-types.not-allowed}">Allowed</td>
              <td>
                <span class="badge" th:classappend="${leaveType.active()} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${leaveType.active()} ? #{common.status.active} : #{common.status.inactive}">Active</span>
              </td>
              <td class="text-end">
                <button type="button" class="btn btn-outline-secondary btn-sm" th:aria-label="#{admin.leave-types.aria.edit}"
                        th:hx-get="@{/admin/leave-types/{id}/edit-form(id=${leaveType.id})}"
                        hx-target="#leaveTypeOffcanvasBody" hx-swap="innerHTML">
                  <i class="bi bi-pencil" aria-hidden="true"></i>
                </button>
                <button th:if="${leaveType.active()}" type="button" class="btn btn-outline-secondary btn-sm"
                        th:aria-label="#{admin.leave-types.aria.deactivate}"
                        th:hx-post="@{/admin/leave-types/{id}/deactivate(id=${leaveType.id})}"
                        hx-target="#leave-types-content" hx-swap="outerHTML">
                  <i class="bi bi-pause-circle" aria-hidden="true"></i>
                </button>
                <button th:unless="${leaveType.active()}" type="button" class="btn btn-outline-success btn-sm"
                        th:aria-label="#{admin.leave-types.aria.activate}"
                        th:hx-post="@{/admin/leave-types/{id}/activate(id=${leaveType.id})}"
                        hx-target="#leave-types-content" hx-swap="outerHTML">
                  <i class="bi bi-play-circle" aria-hidden="true"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <!--/* Slide-over panel (UI Guidelines §6). Never part of an htmx response — only
           #leaveTypeOffcanvasBody is swapped. */-->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="leaveTypeOffcanvas" style="width: 480px"
         aria-labelledby="leaveTypeOffcanvasLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="leaveTypeOffcanvasLabel" th:text="#{admin.leave-types.panel-title}">Leave Type</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" th:aria-label="#{common.aria.close}"></button>
      </div>
      <div class="offcanvas-body" id="leaveTypeOffcanvasBody">
        <th:block th:fragment="leaveTypeForm">
  <form th:object="${leaveTypeForm}"
        th:attr="hx-post=${editingLeaveTypeId == null} ? @{/admin/leave-types} : null,
                 hx-patch=${editingLeaveTypeId != null} ? @{/admin/leave-types/{id}(id=${editingLeaveTypeId})} : null"
        hx-target="#leaveTypeOffcanvasBody" hx-swap="innerHTML" hx-indicator="#leaveTypeFormSpinner">
    <h6 class="text-muted mb-3" th:text="${editingLeaveTypeId != null} ? #{common.form-state.editing} : #{common.form-state.creating-new}">Creating new</h6>

    <div class="mb-3">
      <label class="form-label" for="leave-type-name">
        <span th:text="#{common.field.name}">Name</span> <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <input class="form-control" type="text" id="leave-type-name" th:field="*{name}" maxlength="100" required
             th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Invalid name</div>
    </div>

    <div class="mb-3">
      <label class="form-label d-block" th:text="#{admin.leave-types.icon-label}">Icon</label>
      <!--/* th:field repeated in a loop auto-suffixes the id (icon1, icon2, ...) and sets
             checked/value/name for us; #ids.prev looks up that same generated id so <label for>
             stays in sync (same idiom as leave/book-time-off.html's leave-type chip row). */-->
      <div class="d-flex flex-wrap gap-2">
        <div th:each="option : ${iconOptions}">
          <input type="radio" class="btn-check" autocomplete="off"
                 th:field="*{icon}" th:value="${option.cssClass}" />
          <label class="btn btn-outline-secondary" th:for="${#ids.prev('icon')}"
                 th:title="${option.label}" th:attr="aria-label=${option.label}">
            <i th:class="'bi ' + ${option.cssClass}" aria-hidden="true"></i>
          </label>
        </div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="leave-type-defaultAnnualAllowance">
        <span th:text="#{admin.leave-types.default-allowance-label}">Default annual allowance (days)</span> <span class="text-danger" aria-hidden="true">*</span>
      </label>
      <input class="form-control" type="number" step="0.5" min="0" id="leave-type-defaultAnnualAllowance"
             th:field="*{defaultAnnualAllowance}" required
             th:classappend="${#fields.hasErrors('defaultAnnualAllowance')} ? 'is-invalid'" />
      <div class="invalid-feedback" th:if="${#fields.hasErrors('defaultAnnualAllowance')}"
           th:errors="*{defaultAnnualAllowance}">Invalid allowance</div>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="leave-type-paid" th:field="*{paid}" />
      <label class="form-check-label" for="leave-type-paid" th:text="#{admin.leave-types.paid}">Paid</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="leave-type-allowsHalfDay" th:field="*{allowsHalfDay}" />
      <label class="form-check-label" for="leave-type-allowsHalfDay" th:text="#{admin.leave-types.allows-half-day-label}">Allows half-day requests</label>
    </div>
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="leave-type-allowsBackdated" th:field="*{allowsBackdated}" />
      <label class="form-check-label" for="leave-type-allowsBackdated" th:text="#{admin.leave-types.allows-backdated-label}">Allows backdated requests</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="leave-type-requiresApproval" th:field="*{requiresApproval}" />
      <label class="form-check-label" for="leave-type-requiresApproval" th:text="#{admin.leave-types.requires-approval-label}">Requires approval</label>
    </div>

    <div class="mb-3">
      <label class="form-label" for="leave-type-description" th:text="#{common.field.description}">Description</label>
      <textarea class="form-control" id="leave-type-description" th:field="*{description}" rows="3"></textarea>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="offcanvas" th:text="#{common.action.cancel}">Cancel</button>
      <button class="btn btn-primary btn-sm" type="submit">
        <span id="leaveTypeFormSpinner" class="spinner-border spinner-border-sm htmx-indicator me-1"
              aria-hidden="true"></span>
        <span th:text="#{admin.leave-types.save}">Save leave type</span>
      </button>
    </div>
  </form>

  <!--/* th:if and th:replace on the same tag don't compose (th:replace runs regardless of th:if,
         see admin/organization.html) — nest instead. */-->
  <th:block th:if="${refreshTable}">
    <div th:replace="~{::content}"></div>
  </th:block>
        </th:block>
      </div>
    </div>

  </div>
</th:block>

</body>
</html>
