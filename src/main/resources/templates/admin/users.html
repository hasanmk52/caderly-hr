<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{admin.users.title}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-start mb-4">
      <h1 th:text="#{admin.users.title}">Users</h1>
    </div>

    <div class="alert alert-info d-flex align-items-center mb-4" role="status">
      <i class="bi bi-info-circle me-2" aria-hidden="true"></i>
      <span>
        <span th:text="#{admin.users.info-banner.prefix}">To add a new person, use</span>
        <a th:href="@{/admin/employees}" class="alert-link" th:text="#{admin.users.info-banner.link}">People &gt; Add Employee</a>
        <span th:text="#{admin.users.info-banner.suffix}">— it creates their login and their profile together.</span>
      </span>
    </div>

    <div th:if="${#lists.isEmpty(users)}" class="text-center text-muted py-5">
      <i class="bi bi-people fs-1 d-block mb-2" aria-hidden="true"></i>
      <p class="mb-0" th:text="#{admin.users.empty}">No users yet.</p>
    </div>

    <div th:unless="${#lists.isEmpty(users)}" class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th scope="col" th:text="#{common.field.email}">Email</th>
            <th scope="col" th:text="#{common.field.status}">Status</th>
            <th scope="col" th:text="#{admin.users.table.roles}">Roles</th>
            <th scope="col" th:text="#{admin.users.table.last-login}">Last login</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td th:text="${user.email}">someone@example.com</td>
            <td>
              <!--/* UI Guidelines §9: colour is never the only signal, so each chip pairs its
                     colour with an icon and the status word. */-->
              <span class="badge"
                    th:classappend="${user.status == 'ACTIVE'} ? 'text-bg-success'
                                  : (${user.status == 'INVITED'} ? 'text-bg-warning' : 'text-bg-secondary')">
                <i class="bi" aria-hidden="true"
                   th:classappend="${user.status == 'ACTIVE'} ? 'bi-check-circle'
                                 : (${user.status == 'INVITED'} ? 'bi-hourglass-split' : 'bi-slash-circle')"></i>
                <span th:text="${user.statusLabel}">Active</span>
              </span>
            </td>
            <td th:text="${#strings.listJoin(user.roles, ', ')}">EMPLOYEE</td>
            <td class="text-muted" th:text="${user.lastLoginAt} ?: '—'">—</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</th:block>
</body>
</html>
