<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<!--/* Chrome-free shell for pages rendered outside an authenticated session: the four auth pages
       and the error pages. The main layout hard-wires the topbar and sidebar, both of which
       assume a logged-in user and a navigable app. */-->
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body class="caderly-bare-body">
<main id="main-content" class="caderly-bare-main" th:replace="${content}"></main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
