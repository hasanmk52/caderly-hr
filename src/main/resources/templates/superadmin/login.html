<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{superadmin-layout :: layout(#{superadmin.login.title}, ~{::#content})}">
  <main id="content" class="caderly-bare-main">
    <div class="caderly-bare-card">

      <div class="text-center mb-4">
        <h1 class="h4 mb-1" th:text="#{superadmin.login.title}">Super Admin</h1>
        <p class="text-muted small mb-0" th:text="#{superadmin.login.subtitle}">Sign in to the operator console</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <!--/* Same deliberately-vague-on-which-check-failed convention as auth/login.html. */-->
          <div class="alert alert-danger py-2" role="alert" th:if="${param.error}">
            <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
            <span th:text="#{superadmin.login.error.invalid-credentials}">Incorrect email or password.</span>
          </div>
          <div class="alert alert-danger py-2" role="alert" th:if="${param.rateLimited}">
            <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
            <span th:text="#{superadmin.login.error.rate-limited}">Too many attempts. Please wait a minute and try again.</span>
          </div>
          <div class="alert alert-info py-2" role="status" th:if="${param.loggedOut}"
               th:text="#{superadmin.login.info.logged-out}">
            You have been signed out.
          </div>

          <form th:action="@{/superadmin/login}" method="post">
            <div class="mb-3">
              <label class="form-label" for="email" th:text="#{superadmin.login.email-label}">Email</label>
              <input class="form-control" type="email" id="email" name="email"
                     autocomplete="username" required autofocus />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password" th:text="#{superadmin.login.password-label}">Password</label>
              <input class="form-control" type="password" id="password" name="password"
                     autocomplete="current-password" required />
            </div>
            <button class="btn btn-primary w-100" type="submit" th:text="#{superadmin.login.submit}">Log in</button>
          </form>

        </div>
      </div>
    </div>
  </main>
</th:block>
</html>
