<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<th:block th:replace="~{layout :: layout(#{nav.files}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-start mb-4">
      <h1 th:text="#{nav.files}">Files</h1>
    </div>

    <!--/* Mirrors admin/holidays.html's #holidays-content pattern (AdminLeaveController). */-->
    <div id="files-content" hx-swap-oob="true" th:fragment="content">

      <div th:if="${!#lists.isEmpty(uploadErrors)}" class="alert alert-danger mb-3">
        <p class="mb-1 fw-semibold" th:text="#{admin.holidays.upload-rejected}">The upload was rejected — nothing was added:</p>
        <ul class="mb-0">
          <li th:each="error : ${uploadErrors}" th:text="${error}">The uploaded file exceeds the size limit</li>
        </ul>
      </div>

      <!--/* Dropzone pattern: UI_Guidelines §8.7. */-->
      <div class="card mb-4" sec:authorize="hasRole('ADMIN')">
        <div class="card-body">
          <form th:hx-post="@{/files/upload}"
                hx-target="#files-content" hx-swap="outerHTML" hx-encoding="multipart/form-data">
            <label class="upload-dropzone d-flex flex-column align-items-center justify-content-center text-center p-4 rounded"
                   for="company-file-input">
              <i class="bi bi-cloud-upload fs-1 text-muted mb-2" aria-hidden="true"></i>
              <span class="fw-semibold" th:text="#{profile.documents.dropzone-instructions}">Drag and drop a file here, or click to browse</span>
              <span class="text-muted small mt-1" th:text="#{profile.documents.dropzone-hint}">PDF, PNG, JPG, DOCX, XLSX, PPTX — up to 25 MB</span>
              <span class="upload-dropzone-filename text-primary small mt-2 d-none"></span>
              <input id="company-file-input" class="visually-hidden" type="file" name="file"
                     accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.pptx" required
                     th:aria-label="#{files.upload-input-aria-label}" />
            </label>
            <div class="d-flex justify-content-end mt-3">
              <button type="submit" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-upload" aria-hidden="true"></i> <span th:text="#{files.upload-submit}">Upload file</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(files)}" class="text-center text-muted py-5 mb-5">
        <i class="bi bi-folder2-open fs-1 d-block mb-2" aria-hidden="true"></i>
        <p class="mb-0" th:text="#{files.empty}">No files yet.</p>
      </div>

      <div th:unless="${#lists.isEmpty(files)}" class="table-responsive mb-5">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th scope="col" th:text="#{common.field.name}">Name</th>
              <th scope="col" th:text="#{common.field.size}">Size</th>
              <th scope="col" th:text="#{profile.documents.table.uploaded}">Uploaded</th>
              <th scope="col" class="text-end" th:text="#{common.table.actions}">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="file : ${files}">
              <td th:text="${file.name()}">Employee Handbook.pdf</td>
              <td th:text="${#numbers.formatDecimal(file.sizeBytes() / 1024.0, 0, 1)} + ' KB'">128.0 KB</td>
              <td th:text="${#temporals.format(file.uploadedAt(), 'yyyy-MM-dd')}">2026-08-26</td>
              <td class="text-end">
                <a class="btn btn-outline-secondary btn-sm" th:aria-label="#{files.aria.download}"
                   th:href="@{/files/{id}/download(id=${file.id})}">
                  <i class="bi bi-download" aria-hidden="true"></i>
                </a>
                <button type="button" class="btn btn-outline-danger btn-sm" th:aria-label="#{files.aria.delete}"
                        sec:authorize="hasRole('ADMIN')"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#confirmDeleteFile-' + ${file.id}">
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div th:each="file : ${files}" class="modal fade" tabindex="-1" aria-hidden="true"
           sec:authorize="hasRole('ADMIN')" th:id="'confirmDeleteFile-' + ${file.id}">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" th:text="#{files.delete-confirm(${file.name()})}">Delete this file?</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.aria.close}"></button>
            </div>
            <div class="modal-body">
              <p th:text="#{common.action.delete-warning}">This cannot be undone.</p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" th:text="#{common.action.cancel}">Cancel</button>
              <button type="button" class="btn btn-danger btn-sm" data-bs-dismiss="modal"
                      th:hx-delete="@{/files/{id}(id=${file.id})}"
                      hx-target="#files-content" hx-swap="outerHTML"
                      th:text="#{files.delete-submit}">
                Delete file
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</th:block>
</body>
</html>
