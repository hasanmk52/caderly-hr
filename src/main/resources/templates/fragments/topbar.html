<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="topbar" class="navbar navbar-expand navbar-light bg-white border-bottom px-3 caderly-topbar">
  <!-- Caderly mark + wordmark, then the tenant's uploaded logo as a guest on the brand (ADR 0020);
       without a logo it falls back to the tenant name as text. Mark SVG per
       design-system/assets/logo-kit-README.md's "Web lockup" pattern (caderly-mark-mono
       geometry, currentColor). -->
  <span class="navbar-brand fw-semibold d-inline-flex align-items-center gap-2">
    <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false"
         style="width: 1.15em; height: 1.15em; color: var(--bs-primary);">
      <path d="M40 13H21A8 8 0 0 0 13 21V43A8 8 0 0 0 21 51H48"
            fill="none" stroke="currentColor" stroke-width="10"
            stroke-linecap="butt" stroke-linejoin="round"></path>
      <rect x="41" y="26" width="12" height="12" rx="2" fill="currentColor"></rect>
    </svg>
    <span class="d-none d-sm-inline" th:text="#{common.brand-name}">Caderly</span>
    <th:block th:if="${tenant != null}">
      <span class="caderly-topbar-divider" aria-hidden="true"></span>
      <img th:if="${tenant.logoVersion != null}" th:src="@{/tenant-logo(v=${tenant.logoVersion})}"
           th:alt="${tenant.name}" th:title="${tenant.name}" class="caderly-tenant-logo caderly-tenant-logo--topbar" />
      <span th:unless="${tenant.logoVersion != null}" class="fw-normal text-body-secondary" th:text="${tenant.name}">Acme</span>
    </th:block>
  </span>
  <form class="d-none d-md-flex mx-auto" style="width: 40%" role="search">
    <input class="form-control" type="search" th:placeholder="#{topbar.search-placeholder}"
           th:aria-label="#{topbar.search-placeholder}" disabled />
  </form>
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-primary btn-sm text-nowrap" type="button" data-bs-toggle="modal" data-bs-target="#bookLeaveModal"
            th:hx-get="@{/leave/new}" hx-target="#bookLeaveModalBody" hx-swap="innerHTML"
            th:text="#{topbar.book-time-off}">
      Book time off
    </button>

    <div class="dropdown">
      <button class="btn p-0 rounded-circle bg-secondary-subtle d-inline-flex align-items-center justify-content-center"
              style="width: 2rem; height: 2rem;" type="button"
              id="accountMenuButton" data-bs-toggle="dropdown" aria-expanded="false"
              th:aria-label="#{topbar.account-menu}">
        <i class="bi bi-person-fill" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountMenuButton">
        <li>
          <span class="dropdown-header text-truncate" style="max-width: 16rem"
                sec:authentication="name">someone@example.com</span>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <!--/* No general Settings shell exists yet (Change password/MFA are still deferred),
                 so this links straight at the one settings page that exists rather than a
                 multi-tab page that doesn't exist. */-->
          <a class="dropdown-item" th:href="@{/settings/calendar}">
            <i class="bi bi-calendar-week me-2" aria-hidden="true"></i><span th:text="#{settings.calendar.title}">Calendar integration</span>
          </a>
        </li>
        <li>
          <!--/* A POST form, not a link. Logout is state-changing, so it carries the CSRF
                 token Thymeleaf injects automatically into th:action forms. */-->
          <form th:action="@{/logout}" method="post" class="px-1">
            <button class="dropdown-item" type="submit">
              <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i><span th:text="#{topbar.log-out}">Log out</span>
            </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
