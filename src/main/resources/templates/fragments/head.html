<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/* Parameterised so each page names itself in the browser tab and history. Callers pass a
       page-specific title; it is suffixed with the product name here so no template repeats it. */-->
<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--/* UI Guidelines §13: htmx state-changing requests carry CSRF via a header read from here,
         since they aren't regular form posts that Spring Security's Thymeleaf dialect decorates
         automatically (no th:action on an hx-post form). See helyx.js's configRequest listener. */-->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title th:text="${title} + ' · Helyx HR'">Helyx HR</title>
  <link rel="icon" th:href="@{/favicon.ico}" sizes="any" />
  <link rel="icon" type="image/png" th:href="@{/favicon-32x32.png}" sizes="32x32" />
  <link rel="icon" type="image/png" th:href="@{/favicon-16x16.png}" sizes="16x16" />
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}" />
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" />
  <!--/* UI Guidelines §3: only the weights the type scale actually uses (400/500/600 - no
         700+). Self-hosted via the fontsource webjar, not a CDN - see SecurityConfig's CSP. */-->
  <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/400.css}" />
  <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/500.css}" />
  <link rel="stylesheet" th:href="@{/webjars/fontsource__inter/600.css}" />
  <link rel="stylesheet" th:href="@{/css/helyx.css}" />
  <link rel="stylesheet" th:href="@{/css/theme-overrides.css}" />
</head>
<body></body>
</html>
