<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Shared by accept-invite and reset-password: identical inputs, identical validation
       rendering, different action and button label. Requires a th:object="${form}" of type
       AuthForms.SetPassword on the enclosing form. */-->
<th:block th:fragment="passwordFields">
  <input type="hidden" th:field="*{token}" />

  <div class="mb-3">
    <label class="form-label" for="password">
      New password <span class="text-danger" aria-hidden="true">*</span>
    </label>
    <input class="form-control" type="password" id="password" th:field="*{password}"
           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
           autocomplete="new-password" required autofocus />
    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
         th:errors="*{password}">Invalid password</div>
    <div class="form-text" th:unless="${#fields.hasErrors('password')}">
      At least 10 characters, with an upper-case letter, a lower-case letter, and a digit.
    </div>
  </div>

  <div class="mb-4">
    <label class="form-label" for="confirmPassword">
      Confirm password <span class="text-danger" aria-hidden="true">*</span>
    </label>
    <input class="form-control" type="password" id="confirmPassword" th:field="*{confirmPassword}"
           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
           autocomplete="new-password" required />
    <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
         th:errors="*{confirmPassword}">Passwords do not match</div>
  </div>
</th:block>
</body>
</html>
