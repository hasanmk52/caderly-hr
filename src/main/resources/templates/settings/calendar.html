<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{settings.calendar.title}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">

    <div class="d-flex justify-content-between align-items-start mb-4">
      <h1 th:text="#{settings.calendar.title}">Calendar integration</h1>
    </div>

    <div id="settings-calendar-content" th:fragment="content">
      <div class="card" style="max-width: 40rem;">
        <div class="card-body">
          <p class="text-muted" th:text="#{settings.calendar.description}">
            Subscribe to this link in Google Calendar or Outlook to see your own approved leave automatically.
          </p>

          <label class="form-label" for="ical-url" th:text="#{settings.calendar.url-label}">Your calendar URL</label>
          <div class="input-group mb-2">
            <input type="text" class="form-control" id="ical-url" readonly th:value="${icalUrl}" />
            <button type="button" class="btn btn-outline-secondary" data-copy-target="ical-url"
                    th:attr="data-copied-message=#{settings.calendar.copied}"
                    th:aria-label="#{settings.calendar.copy}">
              <i class="bi bi-clipboard" aria-hidden="true"></i> <span th:text="#{settings.calendar.copy}">Copy</span>
            </button>
          </div>

          <button type="button" class="btn btn-outline-danger btn-sm mt-2"
                  data-bs-toggle="modal" data-bs-target="#confirmRegenerateToken"
                  th:text="#{settings.calendar.regenerate}">Regenerate link</button>
        </div>
      </div>

      <div class="modal fade" id="confirmRegenerateToken" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <form th:hx-post="@{/settings/calendar/regenerate}"
                  hx-target="#settings-calendar-content" hx-swap="outerHTML">
              <div class="modal-header">
                <h5 class="modal-title" th:text="#{settings.calendar.regenerate-confirm-title}">Regenerate your calendar link?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.aria.close}"></button>
              </div>
              <div class="modal-body">
                <p th:text="#{settings.calendar.regenerate-warning}">
                  The current link will stop working immediately. Any calendar app already subscribed to it will need the new link.
                </p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" th:text="#{common.action.cancel}">Cancel</button>
                <button type="submit" class="btn btn-danger btn-sm" th:text="#{settings.calendar.regenerate}">Regenerate link</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</th:block>
</body>
</html>
