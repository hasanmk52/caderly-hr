<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Swapped into #pendingList after approve/reject (row removed, counts implicitly refresh on
       next full load — UI Guidelines §8.6: "row removed via htmx"). Lives in its own file (not
       for-action.html) so rendering the full for-action page never also renders this fragment's
       definition as literal body content — see for-action.html's th:replace comment. */-->
<div id="pendingList" th:fragment="pendingList">
  <div th:if="${#lists.isEmpty(pending)}" class="text-center text-muted py-5">
    <i class="bi bi-inbox fs-1 d-block mb-2" aria-hidden="true"></i>
    <p class="mb-0" th:text="#{leave.for-action.pending-empty}">Nothing waiting on you.</p>
  </div>
  <ul th:unless="${#lists.isEmpty(pending)}" class="list-group">
    <li class="list-group-item" th:each="row : ${pending}" th:id="'leave-request-row-' + ${row.requestId}">
      <div class="d-flex justify-content-between align-items-start gap-3">
        <div class="d-flex align-items-start gap-2">
          <i th:if="${row.icon != null}" th:class="'bi ' + ${row.icon} + ' fs-5'"
             th:style="${row.color != null} ? 'color:' + ${row.color}" aria-hidden="true"></i>
          <div>
            <div class="fw-semibold" th:text="${row.employeeName}">Jane Doe</div>
            <div class="text-muted small">
              <span th:text="${row.leaveTypeName}">Vacation</span> &middot;
              <span th:text="${row.startDate}">2026-08-17</span> - <span th:text="${row.endDate}">2026-08-21</span>
              &middot; <span th:text="${row.durationDays}">5.00</span> day(s)
            </div>
            <div class="text-muted small" th:if="${row.note}" th:text="${row.note}">Family trip</div>
          </div>
        </div>
        <div class="d-flex gap-2 flex-shrink-0">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal"
                  data-bs-target="#rejectLeaveModal"
                  th:hx-get="@{/for-action/leave-requests/{id}/reject-form(id=${row.requestId})}"
                  hx-target="#rejectLeaveModalBody" hx-swap="innerHTML"
                  th:text="#{leave.for-action.reject}">
            Reject
          </button>
          <button type="button" class="btn btn-primary btn-sm"
                  th:hx-post="@{/for-action/leave-requests/{id}/approve(id=${row.requestId})}"
                  hx-target="#pendingList" hx-swap="outerHTML"
                  th:text="#{leave.for-action.approve}">
            Approve
          </button>
        </div>
      </div>
    </li>
  </ul>
</div>

<!--/* Completed table (UI Guidelines §8.6). Its own fragment, same reasoning as pendingList
       above, so it can also be OOB-swapped by pendingListAndCounts below after an
       approve/reject — otherwise the Completed tab and the Pending/Completed counts go stale
       until the next full page load. */-->
<div id="completedList" th:fragment="completedList">
  <div th:if="${#lists.isEmpty(completed)}" class="text-center text-muted py-5">
    <i class="bi bi-check2-circle fs-1 d-block mb-2" aria-hidden="true"></i>
    <p class="mb-0" th:text="#{for-action.completed-empty}">No decisions yet.</p>
  </div>
  <div th:unless="${#lists.isEmpty(completed)}" class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th scope="col" th:text="#{for-action.table.employee}">Employee</th>
          <th scope="col" th:text="#{profile.timeoff.table.type}">Type</th>
          <th scope="col" th:text="#{profile.timeoff.table.dates}">Dates</th>
          <th scope="col" th:text="#{profile.timeoff.table.duration}">Duration</th>
          <th scope="col" th:text="#{common.field.status}">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${completed}">
          <td th:text="${row.employeeName}">Jane Doe</td>
          <td>
            <i th:if="${row.icon != null}" th:class="'bi ' + ${row.icon}"
               th:style="${row.color != null} ? 'color:' + ${row.color}" aria-hidden="true"></i>
            <span th:text="${row.leaveTypeName}">Vacation</span>
          </td>
          <td><span th:text="${row.startDate}">2026-08-17</span> - <span th:text="${row.endDate}">2026-08-21</span></td>
          <td th:text="${row.durationDays}">5.00</td>
          <td>
            <span class="badge" th:text="${row.statusLabel}"
                  th:classappend="${row.statusLabel == 'Approved'} ? 'bg-success-subtle text-success-emphasis' : (${row.statusLabel == 'Rejected'} ? 'bg-danger-subtle text-danger-emphasis' : 'bg-secondary-subtle text-secondary-emphasis')">
              Approved
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!--/* Returned by approve/reject instead of the bare pendingList fragment: htmx swaps
       #pendingList normally (it's the request's own hx-target), and picks up the three
       hx-swap-oob elements below out of the same response to refresh the Pending/Completed
       counts and the Completed table in the same round trip — no more manual page refresh
       needed to see them catch up (UI Guidelines §8.6). */-->
<th:block th:fragment="pendingListAndCounts">
  <div th:replace="~{::pendingList}"></div>
  <span id="pendingCount" hx-swap-oob="true" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(pending)}">0</span>
  <span id="completedCount" hx-swap-oob="true" class="badge bg-secondary-subtle text-secondary-emphasis" th:text="${#lists.size(completed)}">0</span>
  <div id="completedList" hx-swap-oob="true" th:replace="~{::completedList}"></div>
</th:block>

<!--/* Reject modal body (UI Guidelines §6/§8.6): lazily loaded into the empty #rejectLeaveModalBody
       shell in for-action.html, the same convention layout.html uses for #bookLeaveModalBody. */-->
<th:block th:fragment="rejectForm">
  <div class="modal-header">
    <h5 class="modal-title" id="rejectLeaveModalLabel" th:text="#{leave.for-action.reject-request}">Reject request</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.aria.close}"></button>
  </div>
  <form th:object="${rejectForm}" th:hx-post="@{/for-action/leave-requests/{id}/reject(id=${rejectRequestId})}"
        hx-target="#pendingList" hx-swap="outerHTML">
    <div class="modal-body">
      <label class="form-label" for="reject-note" th:text="#{leave.for-action.reason-label}">Reason (optional)</label>
      <textarea class="form-control" id="reject-note" th:field="*{decisionNote}" rows="2" maxlength="500"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal" th:text="#{common.action.cancel}">Cancel</button>
      <button class="btn btn-danger btn-sm" type="submit" th:text="#{leave.for-action.reject-request}">Reject request</button>
    </div>
  </form>
</th:block>

</body>
</html>
