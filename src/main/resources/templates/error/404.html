<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Resolved by Spring Boot's error dispatch on any 404 (UI Guidelines §7.3). The guidelines
       also ask for a search bar here; global search is not built until a later sub-phase, so
       this offers navigation instead of a control that would not work. */-->
<th:block th:replace="~{bare-layout :: layout('Page not found', ~{::#content})}">
  <main id="content" class="caderly-bare-main">
    <div class="caderly-bare-card">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <p class="display-5 fw-semibold text-primary mb-1">404</p>
          <h1 class="h4 mb-2">Page not found</h1>
          <p class="text-muted mb-4">
            The page you are looking for does not exist, or you do not have access to it.
          </p>
          <a class="btn btn-primary" th:href="@{/}">Back to home</a>
        </div>
      </div>
    </div>
  </main>
</th:block>
</html>
