<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* Rendered by GlobalExceptionHandler for browser requests that hit a CaderlyException.
       Spring Boot's own error dispatch uses 404.html / 5xx.html instead. */-->
<th:block th:replace="~{bare-layout :: layout('Something went wrong', ~{::#content})}">
  <main id="content" class="caderly-bare-main">
    <div class="caderly-bare-card">
      <div class="card shadow-sm">
        <div class="card-body p-4 text-center">
          <i class="bi bi-exclamation-triangle text-warning fs-1 d-block mb-3" aria-hidden="true"></i>
          <h1 class="h4 mb-2" th:text="${title}">Something went wrong</h1>
          <p class="text-muted mb-4" th:text="${detail}">An unexpected error occurred.</p>
          <a class="btn btn-primary" th:href="@{/}">Back to home</a>
        </div>
      </div>
    </div>
  </main>
</th:block>
</html>
