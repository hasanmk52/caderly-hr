<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{bare-layout :: layout(#{auth.reset-password.title}, ~{::#content})}">
  <main id="content" class="caderly-bare-main">
    <div class="caderly-bare-card">

      <div class="text-center mb-4">
        <h1 class="h4 mb-1" th:text="${tenant != null} ? ${tenant.name} : #{common.brand-name}">Caderly</h1>
        <p class="text-muted small mb-0" th:text="#{auth.reset-password.title}">Choose a new password</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <!--/* A dead link is reported before the user types anything, rather than after they
                 have entered and confirmed a password. */-->
          <div th:unless="${tokenValid}" class="text-center">
            <i class="bi bi-x-circle text-danger fs-1 d-block mb-3" aria-hidden="true"></i>
            <h2 class="h5 mb-2" th:text="#{auth.reset-password.invalid-heading}">This link is no longer valid</h2>
            <p class="text-muted" th:text="${pageError} ?: #{auth.reset-password.invalid-default-detail}">
              Reset links can be used once and expire after 24 hours.
            </p>
            <a class="btn btn-primary" th:href="@{/forgot-password}" th:text="#{auth.reset-password.request-new-link}">Request a new link</a>
          </div>

          <form th:if="${tokenValid}" th:action="@{/reset-password}" th:object="${form}" method="post">
            <th:block th:replace="~{fragments/password-fields :: passwordFields}"></th:block>
            <button class="btn btn-primary w-100" type="submit" th:text="#{auth.reset-password.submit}">Change password</button>
          </form>

        </div>
      </div>
    </div>
  </main>
</th:block>
</html>
