<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{bare-layout :: layout('Set your password', ~{::#content})}">
  <main id="content" class="helyx-bare-main">
    <div class="helyx-bare-card">

      <div class="text-center mb-4">
        <h1 class="h4 mb-1" th:text="${tenant != null ? tenant.name : 'Helyx'}">Helyx</h1>
        <p class="text-muted small mb-0">Welcome — set a password to get started</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <div class="alert alert-danger py-2" role="alert" th:if="${pageError}">
            <i class="bi bi-exclamation-circle me-1" aria-hidden="true"></i>
            <span th:text="${pageError}">This invite link is invalid or has expired.</span>
          </div>

          <form th:action="@{/accept-invite}" th:object="${form}" method="post">
            <th:block th:replace="~{fragments/password-fields :: passwordFields}"></th:block>
            <button class="btn btn-primary w-100" type="submit">Set password</button>
          </form>

        </div>
      </div>
    </div>
  </main>
</th:block>
</html>
