<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<!--/* UI Guidelines §9: skip link must be the first focusable element and visible on focus. */-->
<a class="visually-hidden-focusable skip-link" th:href="@{#main-content}" th:text="#{common.skip-to-main-content}">Skip to main content</a>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <main id="main-content" class="flex-grow-1 p-4" th:replace="${content}"></main>
</div>
<!--/* Book Time Off modal (UI Guidelines §8.1) — global: the topbar CTA (fragments/topbar.html)
       is present on every page. Only #bookLeaveModalBody is swapped by htmx; the modal element
       itself is static so Bootstrap's data-bs-toggle can show it immediately on click. */-->
<div class="modal fade" id="bookLeaveModal" tabindex="-1" aria-hidden="true" aria-labelledby="bookLeaveModalLabel">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" id="bookLeaveModalBody"></div>
  </div>
</div>
<!--/* UI Guidelines §7.4: toasts are the only success-confirmation mechanism. */-->
<div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"
     aria-live="polite" aria-atomic="true"></div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<!--/* CSP-safe build (SecurityConfig has no 'unsafe-eval') — see pom.xml's alpinejs__csp comment. */-->
<script th:src="@{/webjars/alpinejs__csp/dist/cdn.min.js}" defer></script>
<script th:src="@{/js/caderly.js}"></script>
</body>
</html>
