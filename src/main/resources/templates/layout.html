<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head th:replace="~{fragments/head :: head(${title})}"></head>
<body>
<!--/* UI Guidelines §9: skip link must be the first focusable element and visible on focus. */-->
<a class="visually-hidden-focusable skip-link" th:href="@{#main-content}">Skip to main content</a>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="d-flex">
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>
  <main id="main-content" class="flex-grow-1 p-4" th:replace="${content}"></main>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/webjars/alpinejs/dist/cdn.min.js}" defer></script>
</body>
</html>
