<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{layout :: layout(#{home.title}, ~{::#content})}">
  <div id="content" class="flex-grow-1 p-4">
    <h1 th:text="${firstName != null} ? #{home.welcome-named(${firstName})} : #{home.welcome-anonymous}">Welcome!</h1>
    <p class="text-muted mb-4" th:text="#{home.subtitle}">Here's your Caderly HR home.</p>

    <!--/* UI Guidelines §8.2: 3/2/1-column grid, 6 widgets max, each independently htmx-loaded
           on page load so they fetch in parallel rather than blocking the initial render. */-->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
      <div class="col">
        <div class="card h-100" hx-get="/widgets/book-time-off" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <div class="col">
        <div class="card h-100" hx-get="/widgets/my-peers" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <div class="col">
        <div class="card h-100" hx-get="/widgets/time-off-today" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <div class="col">
        <div class="card h-100" hx-get="/widgets/my-days-off" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <div class="col">
        <div class="card h-100" hx-get="/widgets/upcoming-holidays" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
      <div class="col">
        <div class="card h-100" hx-get="/widgets/resources" hx-trigger="load" hx-swap="outerHTML"></div>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
