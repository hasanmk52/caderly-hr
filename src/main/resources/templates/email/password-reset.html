<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/_layout :: page(~{::content})}">
<td th:fragment="content">
  <h1 th:replace="~{email/_components :: heading(#{email.password-reset.body.heading})}"></h1>
  <p style="margin:0 0 4px;" th:text="#{email.password-reset.body.message(${tenantName})}">
    We received a request to reset your Acme password.
  </p>
  <table th:replace="~{email/_components :: cta(${resetUrl}, #{email.password-reset.body.cta})}"></table>
  <p style="margin:16px 0 0;font-size:13px;color:#5F6675;" th:text="#{email.common.paste-link}">
    Or paste this link into your browser:
  </p>
  <p style="margin:2px 0 0;font-size:13px;word-break:break-all;">
    <a th:href="${resetUrl}" th:text="${resetUrl}" style="color:#0F5568;">https://acme.caderly.app/reset-password?token=…</a>
  </p>
  <p style="margin:16px 0 0;font-size:13px;color:#5F6675;" th:text="#{email.password-reset.body.expiry}">
    This link can be used once and expires in 24 hours.
  </p>
</td>
</body>
</html>
