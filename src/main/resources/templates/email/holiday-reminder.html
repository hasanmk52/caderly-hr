<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/_layout :: page(~{::content})}">
<td th:fragment="content">
  <h1 th:replace="~{email/_components :: heading(#{email.holiday-reminder.body.heading})}"></h1>
  <p style="margin:0 0 4px;" th:text="#{email.holiday-reminder.body.message(${holidayName}, ${holidayDate})}">
    Eid al-Adha falls on Friday, Aug 7 — the office is closed.
  </p>
  <p style="margin:12px 0 0;font-size:14px;color:#4A5160;" th:text="#{email.holiday-reminder.body.no-action}">
    Nothing to do: a public holiday never counts against your leave balance.
  </p>
</td>
</body>
</html>
