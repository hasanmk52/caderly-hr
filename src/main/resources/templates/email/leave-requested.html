<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/_layout :: page(~{::content})}">
<td th:fragment="content">
  <h1 th:replace="~{email/_components :: heading(#{email.leave-requested.body.heading})}"></h1>
  <!--/* The name is emphasised by the template, not by markup embedded in messages.properties:
         a <strong>{0}</strong> in a message value forces th:utext at the call site and would
         unescape a user-supplied name straight into the body. */-->
  <p style="margin:0 0 4px;">
    <strong th:text="${requesterName}">Priya Nair</strong>
    <span th:text="#{email.leave-requested.body.message}"> is waiting for your approval.</span>
  </p>
  <table th:replace="~{email/_components :: facts(${facts})}"></table>
  <table th:replace="~{email/_components :: cta(${reviewUrl}, #{email.leave-requested.body.cta})}"></table>
</td>
</body>
</html>
