<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{email/_layout :: page(~{::content})}">
<td th:fragment="content">
  <h1 th:replace="~{email/_components :: heading(#{email.leave-rejected.body.heading})}"></h1>
  <p style="margin:0 0 4px;"
     th:text="#{email.leave-rejected.body.message(${leaveTypeName}, ${dateRange}, ${approverName})}">
    Your Vacation request for Aug 3 – Aug 10 was declined by Rahul Menon.
  </p>
  <table th:replace="~{email/_components :: facts(${facts})}"></table>
  <p th:if="${!#strings.isEmpty(decisionNote)}" style="margin:0;"
     th:text="#{email.leave-rejected.body.note(${decisionNote})}">Note: team is short-staffed that week.</p>
</td>
</body>
</html>
