# --- error: CaderlyException detail text, keyed by errorCode (ADR 0013). Falls back to the
# throw site's own message when a key is absent (GlobalExceptionHandler#resolve /
# WebMessages#errorDetail) — so an errorCode is deliberately left out here, rather than given a
# static entry, whenever its message embeds a runtime value (a name, a count, a date, a byte
# limit): GlobalExceptionHandler passes no MessageSource args today, so a static override would
# silently drop that detail. Also deliberately absent: EMPLOYEE_NOT_FOUND, thrown with two
# different texts depending on context ("Employee not found" for a generic lookup vs. "No
# employee record is linked to this account" for the self-service ownEmployee() helpers) — one
# properties entry would overwrite whichever context didn't win, so both keep using their own
# throw-site fallback until that's split into two distinct error codes.
error.calendar-token-invalid=This calendar link is invalid
error.company-file-not-found=File not found
error.department-archived=Cannot assign an employee to an archived department
error.department-not-found=Department not found
