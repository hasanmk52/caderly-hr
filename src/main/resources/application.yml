server:
  servlet:
    session:
      # PRD §19.1 idle timeout. The 24 h ABSOLUTE cap is not expressible here — this setting
      # only measures inactivity — and is enforced by AbsoluteSessionTimeoutFilter.
      timeout: 8h
      cookie:
        http-only: true
        # Secure defaults to on; the dev profile turns it off because dev runs over plain
        # HTTP on *.localhost and the browser would otherwise never send the cookie back.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: helyx-hr
  profiles:
    active: dev
  data:
    jpa:
      repositories:
        # Discriminator multi-tenancy (@TenantId, ADR 0004) resolves a tenant for every
        # Hibernate session, including the eager query validation Spring Data normally
        # does at startup for EVERY repository - even TenantRepository, which must be
        # queryable before any tenant is known (it's what resolves the tenant). LAZY
        # defers that first touch to actual first invocation, which for TenantRepository
        # happens inside TenantService#bySlug's TenantContext.runAsSystem(...) block.
        bootstrap-mode: lazy
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: helyx_hr
  flyway:
    enabled: true
    schemas: helyx_hr

# Tenant subdomains sit under this domain ({slug}.helyx.app in prod, {slug}.localhost
# in dev). Prod profile overrides via HELYX_BASE_DOMAIN / helyx.base-domain.
helyx:
  base-domain: localhost
  email:
    # No default: a wrong From address silently lands mail in spam, so an unset value
    # should stop startup rather than be guessed (CLAUDE.md §6 A05 - no defaults in yml).
    from: ${HELYX_EMAIL_FROM}
    dispatcher:
      # Turned off in tests so they can drain the outbox at a known moment instead of
      # racing the scheduler.
      enabled: true
      poll-interval-ms: 30000

logging:
  level:
    root: info
    com.helyx.helyxhr: info
  #structured:
  #  format:
  #    console: logstash
