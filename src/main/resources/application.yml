server:
  servlet:
    session:
      # PRD §19.1 idle timeout. The 24 h ABSOLUTE cap is not expressible here — this setting
      # only measures inactivity — and is enforced by AbsoluteSessionTimeoutFilter.
      timeout: 8h
      cookie:
        http-only: true
        # Secure defaults to on; the dev profile turns it off because dev runs over plain
        # HTTP on *.localhost and the browser would otherwise never send the cookie back.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: caderly-hr
  web:
    error:
      # Pinned, not left to the default (CLAUDE.md §6 A05). Boot's own default is already NEVER,
      # but spring-boot-devtools raises these to ALWAYS through its default property source, so a
      # dev error response carried a full stack trace: package layout, framework versions, the
      # entire filter chain. Setting them explicitly wins over devtools and makes the behaviour
      # identical in every profile instead of depending on which jars are on the classpath.
      #
      # NOTE the namespace. These moved from `server.error.*` to `spring.web.error.*` in Boot
      # 4.0.0, and the old keys are deprecated at level=error — meaning Boot silently ignores
      # them rather than failing. `server.error.include-stacktrace: never` looks correct, is
      # accepted without warning, and does nothing at all.
      include-stacktrace: never
      include-exception: false
      include-message: never
      include-binding-errors: never
  profiles:
    active: dev
  data:
    jpa:
      repositories:
        # Discriminator multi-tenancy (@TenantId, ADR 0004) resolves a tenant for every
        # Hibernate session, including the eager query validation Spring Data normally
        # does at startup for EVERY repository - even TenantRepository, which must be
        # queryable before any tenant is known (it's what resolves the tenant). LAZY
        # defers that first touch to actual first invocation, which for TenantRepository
        # happens inside TenantService#bySlug's TenantContext.runAsSystem(...) block.
        bootstrap-mode: lazy
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: caderly_hr
  flyway:
    enabled: true
    schemas: caderly_hr
  servlet:
    multipart:
      # Above caderly.storage.max-file-size (25MB) on purpose: a normal oversize upload should
      # fail inside UploadValidator with a friendly inline message, not abort here as a raw
      # MaxUploadSizeExceededException. This is the backstop for a non-browser client bypassing
      # the app's own limit (ADR 0012).
      max-file-size: 30MB
      max-request-size: 32MB

# Tenant subdomains sit under this domain ({slug}.caderly.app in prod, {slug}.localhost
# in dev). Prod profile overrides via CADERLY_BASE_DOMAIN / caderly.base-domain.
caderly:
  base-domain: localhost
  email:
    # No default: a wrong From address silently lands mail in spam, so an unset value
    # should stop startup rather than be guessed (CLAUDE.md §6 A05 - no defaults in yml).
    from: ${CADERLY_EMAIL_FROM}
    dispatcher:
      # Turned off in tests so they can drain the outbox at a known moment instead of
      # racing the scheduler.
      enabled: true
      poll-interval-ms: 30000
  people:
    # AES-256-GCM key for CryptoConverter (ADR 0008, CLAUDE.md §6 A02) — base64, 32 raw bytes.
    # No default: an unset key must fail startup, never silently encrypt with a guessed value.
    encryption-key: ${CADERLY_EMPLOYEE_ENCRYPTION_KEY}
    termination-job:
      enabled: true
      # Once a day is enough: termination_date is a date, not a timestamp, so nothing is
      # lost by not reacting within the same minute the clock crosses midnight.
      cron: "0 0 0 * * *"
  storage:
    # S3-compatible backend is deferred (ADR 0012) — "local" is the only value LocalFileStorage's
    # @ConditionalOnProperty currently matches.
    backend: local
    local:
      root: ${CADERLY_STORAGE_ROOT:./data/files}
    # PRD §6.7 FR-7.3. Below the servlet's spring.servlet.multipart.max-file-size so an oversize
    # upload fails inside UploadValidator with a friendly inline message, not a raw 413 (ADR 0012).
    max-file-size: 25MB

logging:
  level:
    root: info
    com.caderly.caderlyhr: info
  #structured:
  #  format:
  #    console: logstash
